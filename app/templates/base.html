<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI News Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-meta">
        <span class="edition">Daily Edition &mdash; <span id="last-fetched"
          {% if last_fetched_utc is defined and last_fetched_utc %}data-utc="{{ last_fetched_utc }}"{% endif %}
        ></span></span>
      </div>
      <h1 class="paper-title"><a href="/">The AI Intelligence</a></h1>
      <div class="masthead-links">
        <a href="/">Home</a>
        <a href="/admin">Admin</a>
        <button id="theme-toggle" class="theme-toggle-btn" title="Toggle dark/light mode" aria-label="Toggle theme">
          <span class="theme-icon">&#9790;</span>
        </button>
        <div class="settings-dropdown">
          <button class="settings-btn" title="Settings" aria-label="Settings">&#9881;</button>
          <div class="settings-panel">
            <div class="font-size-ctrl">
              <span class="settings-label">Font size</span>
              <button id="font-dec" title="Decrease font size">A&minus;</button>
              <button id="font-inc" title="Increase font size">A+</button>
            </div>
            <span class="version-tag">v{{ app_version }}</span>
          </div>
        </div>
      </div>
    </div>
    <nav class="filter-nav">
      {% block filter_nav %}{% endblock %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    AI News Tracker &mdash; Daily AI digest
  </footer>

  {% block scripts %}{% endblock %}
  <script>
    // ---- Theme toggle ----
    const THEME_KEY = 'ai-news-theme';
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = themeToggle?.querySelector('.theme-icon');

    function applyTheme(mode) {
      if (mode === 'dark') {
        document.documentElement.classList.add('dark');
        if (themeIcon) themeIcon.textContent = '\u2600'; // sun
      } else {
        document.documentElement.classList.remove('dark');
        if (themeIcon) themeIcon.textContent = '\u263E'; // moon
      }
    }

    // Init: check localStorage, then system preference
    (function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved) {
        applyTheme(saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        applyTheme('dark');
      }
    })();

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.classList.contains('dark');
        const next = isDark ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem(THEME_KEY, next);
      });
    }

    // ---- Font size control ----
    const FONT_KEY = 'ai-news-font-size';
    const FONT_MIN = 11, FONT_MAX = 22, FONT_STEP = 1;
    const FONT_DEFAULT = 16;

    function applyFontSize(px) {
      document.documentElement.style.setProperty('--article-font-size', px + 'px');
    }

    (function initFontSize() {
      const saved = parseInt(localStorage.getItem(FONT_KEY), 10);
      applyFontSize(saved || FONT_DEFAULT);
    })();

    document.getElementById('font-dec').addEventListener('click', () => {
      const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--article-font-size'), 10) || FONT_DEFAULT;
      const next = Math.max(FONT_MIN, cur - FONT_STEP);
      applyFontSize(next);
      localStorage.setItem(FONT_KEY, next);
    });
    document.getElementById('font-inc').addEventListener('click', () => {
      const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--article-font-size'), 10) || FONT_DEFAULT;
      const next = Math.min(FONT_MAX, cur + FONT_STEP);
      applyFontSize(next);
      localStorage.setItem(FONT_KEY, next);
    });

    // ---- Settings dropdown ----
    const settingsDropdown = document.querySelector('.settings-dropdown');
    if (settingsDropdown) {
      const settingsBtn = settingsDropdown.querySelector('.settings-btn');
      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        settingsDropdown.classList.toggle('open');
      });
      document.addEventListener('click', () => settingsDropdown.classList.remove('open'));
    }

    const el = document.getElementById('last-fetched');
    if (el && el.dataset.utc) {
      const dt = new Date(el.dataset.utc.replace(' ', 'T') + 'Z');
      el.textContent = dt.toLocaleString([], {
        weekday: 'long', year: 'numeric', month: 'long',
        day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }
  </script>
</body>
</html>
