<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI News Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-meta">
        <span class="edition">Daily Edition &mdash; <span id="current-date"></span></span>
      </div>
      <h1 class="paper-title">The AI Intelligence</h1>
      <div class="masthead-links">
        <a href="/admin">Admin</a>
      </div>
    </div>
    <nav class="filter-nav">
      <a href="/?source=all" class="filter-btn {% if active_filter == 'all' %}active{% endif %}">All Sources</a>
      <a href="/?source=reddit" class="filter-btn {% if active_filter == 'reddit' %}active{% endif %}">Reddit</a>
      <a href="/?source=youtube" class="filter-btn {% if active_filter == 'youtube' %}active{% endif %}">YouTube</a>
      <a href="/?source=hackernews" class="filter-btn {% if active_filter == 'hackernews' %}active{% endif %}">Hacker News</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>AI News Tracker &mdash; Relevancy-ranked daily digest</p>
  </footer>

  {% block scripts %}{% endblock %}
  <script>
    const lastFetched = {{ (last_fetched[:16] | tojson) if (last_fetched is defined and last_fetched) else 'null' }};
    const dateEl = document.getElementById('current-date');
    if (lastFetched) {
      // lastFetched is UTC "YYYY-MM-DD HH:MM" — append Z so Date parses it as UTC
      const dt = new Date(lastFetched.replace(' ', 'T') + ':00Z');
      const longDate = dt.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const time = dt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
      dateEl.textContent = longDate + ' ' + time;
    } else {
      dateEl.textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
  </script>
</body>
</html>
