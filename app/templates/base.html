<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI News Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-meta">
        <span class="edition">Daily Edition &mdash; <span id="last-fetched"
          {% if last_fetched_utc is defined and last_fetched_utc %}data-utc="{{ last_fetched_utc }}"{% endif %}
        ></span></span>
      </div>
      <h1 class="paper-title">The AI Intelligence</h1>
      <div class="masthead-links">
        <a href="/admin">Admin</a>
        <div class="font-size-ctrl">
          <button id="font-dec" title="Decrease font size">A−</button>
          <button id="font-inc" title="Increase font size">A+</button>
        </div>
      </div>
    </div>
    <nav class="filter-nav">
      <a href="/?source=all" class="filter-btn {% if active_filter == 'all' %}active{% endif %}">All Sources</a>
      <a href="/?source=reddit" class="filter-btn {% if active_filter == 'reddit' %}active{% endif %}">Reddit</a>
      <a href="/?source=youtube" class="filter-btn {% if active_filter == 'youtube' %}active{% endif %}">YouTube</a>
      <a href="/?source=hackernews" class="filter-btn {% if active_filter == 'hackernews' %}active{% endif %}">Hacker News</a>
      <a href="/?source=bookmarks" class="filter-btn {% if active_filter == 'bookmarks' %}active{% endif %}">Bookmarks</a>
      <a href="/?source=dismissed" class="filter-btn {% if active_filter == 'dismissed' %}active{% endif %}">Dismissed</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>AI News Tracker &mdash; Relevancy-ranked daily digest</p>
  </footer>

  {% block scripts %}{% endblock %}
  <script>
    // ---- Font size control ----
    const FONT_KEY = 'ai-news-font-size';
    const FONT_MIN = 11, FONT_MAX = 22, FONT_STEP = 1;
    const FONT_DEFAULT = 16;

    function applyFontSize(px) {
      document.documentElement.style.setProperty('--article-font-size', px + 'px');
    }

    (function initFontSize() {
      const saved = parseInt(localStorage.getItem(FONT_KEY), 10);
      applyFontSize(saved || FONT_DEFAULT);
    })();

    document.getElementById('font-dec').addEventListener('click', () => {
      const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--article-font-size'), 10) || FONT_DEFAULT;
      const next = Math.max(FONT_MIN, cur - FONT_STEP);
      applyFontSize(next);
      localStorage.setItem(FONT_KEY, next);
    });
    document.getElementById('font-inc').addEventListener('click', () => {
      const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--article-font-size'), 10) || FONT_DEFAULT;
      const next = Math.min(FONT_MAX, cur + FONT_STEP);
      applyFontSize(next);
      localStorage.setItem(FONT_KEY, next);
    });

    const el = document.getElementById('last-fetched');
    if (el && el.dataset.utc) {
      const dt = new Date(el.dataset.utc.replace(' ', 'T') + 'Z');
      el.textContent = dt.toLocaleString([], {
        weekday: 'long', year: 'numeric', month: 'long',
        day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }
  </script>
</body>
</html>
